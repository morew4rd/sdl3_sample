name: Build Sample (Mac)

# on: [push, pull_request]
on:
  push:
    branches:
      - rel
    tags:
      - test

jobs:
    build-mac:
        name: Build for Apple
        runs-on: macos-14
        strategy:
            fail-fast: false
            matrix:
                # target: [iOS, tvOS, visionOS, macOS]
                target: [macOS]
        steps:
          - uses: actions/checkout@v4
            with:
                submodules: recursive
          - name: Setup Xcode version
            uses: maxim-lobanov/setup-xcode@v1.6.0
            with:
                xcode-version: "16.1"
          - name: Configure
            run: |
                if [ "${{ matrix.target }}" == "macOS" ]; then
                  cmake -G "Xcode" -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -S . -B build
                else
                  cmake -G "Xcode" -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_SYSTEM_NAME=${{ matrix.target }} -DCMAKE_OSX_ARCHITECTURES="arm64" -S . -B build
                fi
          - name: Build
            run: cmake --build build --target install --config Release
          - name: Ad-Hoc Codesign
            run: codesign -s - -f "./build/release/sdl-min.app" --deep
          - name: Create DMG
            if: matrix.target == 'macOS'
            run: |
                cd build
                hdiutil create -srcfolder release -volname sdl_min_apple_macOS sdl_min_apple_macOS.dmg
          - name: Upload Build
            if: matrix.target == 'macOS'
            uses: actions/upload-artifact@v4
            with:
                name: sdl-min-apple-macOS
                path: build/*.dmg
